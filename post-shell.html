<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights — CNT Promo &amp; Ads Specialists, Inc.</title>
  <meta name="description" content="Hiring insights, market notes and career advice from CNT Promo & Ads Specialists, Inc." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="https://uploads.onecompiler.io/43d4zm644/44r932epq/icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <link rel="stylesheet" href="assets/site-chrome.css" />
  <script src="assets/site-chrome.js" defer></script>
  <style>
    :root{--red:#C8102E;--red-deep:#A50D24;--charcoal:#1A1A1A;--ink:#1a1a1a;--gray-400:#9CA3AF;--gray-600:#6B7280;--line:#ECECEC}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.7}
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%;height:auto}
    .container{width:min(720px,100% - 40px);margin-inline:auto}
    .article{padding:28px 0 90px}
    .backlink{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--gray-600);margin-bottom:26px}
    .backlink:hover{color:var(--red)}
    /* Editorial masthead — serif, generous, Claude-like reading */
    .p-head{margin-bottom:30px}
    .p-cat{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:16px}
    .p-title{font-family:'Manrope',sans-serif;font-optical-sizing:auto;font-size:clamp(2rem,4.6vw,3.1rem);font-weight:600;line-height:1.1;letter-spacing:-.015em;color:var(--charcoal)}
    .p-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;font-size:.9rem;color:var(--gray-600)}
    .p-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--gray-400)}
    .p-meta .author{font-weight:700;color:var(--charcoal)}
    .p-cover{width:100%;border-radius:18px;margin:34px 0 8px;box-shadow:0 18px 50px rgba(0,0,0,.14);aspect-ratio:16/9;object-fit:cover;background:linear-gradient(135deg,#1A1A1A,#C8102E)}
    /* Article body — serif for the long-form reading experience */
    .p-body{font-family:'Manrope',sans-serif;font-optical-sizing:auto;font-size:1.22rem;line-height:1.75;color:#25211f;margin-top:34px}
    .p-body p{margin-bottom:1.35rem}
    .p-body p:first-child::first-letter{font-size:3.4rem;font-weight:600;float:left;line-height:.82;padding:4px 12px 0 0;color:var(--red)}
    .p-body h2{font-size:1.6rem;font-weight:600;letter-spacing:-.01em;color:var(--charcoal);margin:2.4rem 0 .9rem;line-height:1.2}
    .p-body strong{font-weight:700}
    .p-share{display:flex;align-items:center;gap:12px;margin-top:44px;padding-top:26px;border-top:1px solid var(--line);font-family:'Inter',sans-serif}
    .p-share span{font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-600)}
    .p-share a{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F3F4F6;color:var(--charcoal);transition:all .18s ease}
    .p-share a:hover{background:var(--red);color:#fff;transform:translateY(-2px)}
    /* In-photo gallery + lightbox (shared with events) */
    .gallery-title{font-family:'Manrope',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--charcoal);margin:44px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--red);display:inline-block}
    .gallery{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:96px;grid-auto-flow:dense;gap:10px}
    .gallery a{grid-column:span 2;grid-row:span 2;overflow:hidden;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);cursor:zoom-in;background:#eee}
    .gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
    .gallery a:hover img{transform:scale(1.05)}
    .gallery a:first-child{grid-column:span 4;grid-row:span 4}
    .gallery a:nth-child(6n+5){grid-column:span 3}
    @media(max-width:640px){.gallery{grid-template-columns:repeat(4,1fr);grid-auto-rows:78px}.gallery a:first-child{grid-column:span 4;grid-row:span 3}}
    .lb{position:fixed;inset:0;z-index:9000;background:rgba(10,10,12,.94);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .22s ease;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
    .lb.open{display:flex;opacity:1}
    .lb-stage{position:relative;width:min(1100px,92vw);height:min(84vh,900px);display:flex;align-items:center;justify-content:center}
    .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
    .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s ease}
    .lb-btn:hover{background:var(--red)}
    .lb-prev{left:-4px}.lb-next{right:-4px}
    .lb-close{position:absolute;top:20px;right:24px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.5rem;cursor:pointer}
    .lb-close:hover{background:var(--red)}
    .lb-count{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:.85rem;font-weight:700}
    @media(max-width:640px){.lb-btn{width:44px;height:44px}}
    .state{padding:80px 0;text-align:center;color:var(--gray-600)}
  </style>
</head>
<body>
  <div id="site-header" data-active="insights"></div>

  <main class="article">
    <div class="container">
      <a class="backlink" href="insights.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>All insights</a>
      <div id="post-content"><div class="state">Loading…</div></div>
    </div>
  </main>

  <!-- Photo lightbox -->
  <div class="lb" id="lb" aria-hidden="true">
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <div class="lb-stage">
      <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <img id="lb-img" src="" alt="">
      <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <div class="lb-count" id="lb-count"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script>
  (function(){
    var esc=function(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
    var el=document.getElementById('post-content');
    var id=new URLSearchParams(location.search).get('id');
    var sb=(window.getSupabase&&window.getSupabase());
    if(!id){ el.innerHTML='<div class="state">No article selected. <a href="insights.html" style="color:var(--red);font-weight:600;">Back to Insights</a></div>'; return; }
    if(!sb){ el.innerHTML='<div class="state">Unable to load right now. Please try again later.</div>'; return; }

    var fmtDate=function(s){ if(!s) return ''; try{ return new Date(s).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }catch(_){ return ''; } };
    var readTime=function(t){ var w=String(t||'').trim().split(/\s+/).filter(Boolean).length; return Math.max(1,Math.round(w/200))+' min read'; };

    sb.from('posts').select('*').eq('id',id).eq('published',true).single().then(function(res){
      var p=res.data;
      if(res.error||!p){ el.innerHTML='<div class="state">This article was not found or is no longer available.<br><a href="insights.html" style="color:var(--red);font-weight:600;">Back to Insights</a></div>'; return; }
      document.title=(p.title||'Insights')+' — CNT Insights';
      try{ var vk='cnt_post_'+id; if(!sessionStorage.getItem(vk)){ sessionStorage.setItem(vk,'1'); Promise.resolve(sb.rpc('cnt_increment_post_view',{p_id:Number(id)})).catch(function(){}); } }catch(_){}

      var date=fmtDate(p.publish_at||p.created_at);
      var paras=String(p.body||p.excerpt||'').split(/\n{1,}/).map(function(x){return x.trim();}).filter(Boolean)
        .map(function(x){ return /^##\s+/.test(x) ? '<h2>'+esc(x.replace(/^##\s+/,''))+'</h2>' : '<p>'+esc(x)+'</p>'; }).join('');

      var pics=Array.isArray(p.images)?p.images.filter(Boolean):[];
      var gallery='';
      if(pics.length){
        gallery='<h3 class="gallery-title">In Photos</h3><div class="gallery">'+pics.map(function(u,i){return '<a href="'+esc(u)+'" data-i="'+i+'"><img src="'+esc(u)+'" alt="Photo '+(i+1)+'" loading="lazy"></a>';}).join('')+'</div>';
      }

      var shareUrl=encodeURIComponent(location.origin+'/post.html?id='+id);
      var shareTxt=encodeURIComponent(p.title||'');
      var share='<div class="p-share"><span>Share</span>'
        +'<a href="https://www.facebook.com/sharer/sharer.php?u='+shareUrl+'" target="_blank" rel="noopener" aria-label="Share on Facebook"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.75-1.6 1.5V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg></a>'
        +'<a href="https://www.linkedin.com/sharing/share-offsite/?url='+shareUrl+'" target="_blank" rel="noopener" aria-label="Share on LinkedIn"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM3.5 8.5h3v12h-3v-12zm5 0h2.9v1.6h.04c.4-.75 1.4-1.6 2.96-1.6 3.16 0 3.75 2 3.75 4.7v7.3h-3v-6.5c0-1.55-.03-3.55-2.2-3.55-2.2 0-2.53 1.7-2.53 3.44v6.6h-3v-12z"/></svg></a>'
        +'<a href="https://twitter.com/intent/tweet?url='+shareUrl+'&text='+shareTxt+'" target="_blank" rel="noopener" aria-label="Share on X"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 1.2h3.7l-8 9.1L24 22.8h-7.4l-5.8-7.6-6.6 7.6H.5l8.6-9.8L0 1.2h7.6l5.2 6.9 6.1-6.9zm-1.3 19.4h2L6.5 3.3H4.4L17.6 20.6z"/></svg></a>'
        +'</div>';

      el.innerHTML='<div class="p-head">'
        +(p.category?'<div class="p-cat">'+esc(p.category)+'</div>':'')
        +'<h1 class="p-title">'+esc(p.title||'')+'</h1>'
        +'<div class="p-meta">'
          +(p.author?'<span class="author">'+esc(p.author)+'</span><span class="dot"></span>':'')
          +(date?'<span>'+esc(date)+'</span><span class="dot"></span>':'')
          +'<span>'+readTime(p.body)+'</span>'
        +'</div></div>'
        +(p.cover_image?'<img class="p-cover" src="'+esc(p.cover_image)+'" alt="'+esc(p.title||'')+'">':'')
        +'<div class="p-body">'+(paras||'<p></p>')+'</div>'
        +share+gallery;

      if(pics.length) initLightbox(pics, el);
    });

    function initLightbox(pics, root){
      var lb=document.getElementById('lb'), img=document.getElementById('lb-img'),
          count=document.getElementById('lb-count'), cur=0;
      function show(i){ cur=(i+pics.length)%pics.length; img.src=pics[cur]; img.alt='Photo '+(cur+1)+' of '+pics.length; count.textContent=(cur+1)+' / '+pics.length; }
      function open(i){ show(i); lb.classList.add('open'); lb.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
      function close(){ lb.classList.remove('open'); lb.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
      root.querySelectorAll('.gallery a').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); open(+a.getAttribute('data-i')); }); });
      document.getElementById('lb-prev').addEventListener('click',function(e){ e.stopPropagation(); show(cur-1); });
      document.getElementById('lb-next').addEventListener('click',function(e){ e.stopPropagation(); show(cur+1); });
      document.getElementById('lb-close').addEventListener('click',close);
      lb.addEventListener('click',function(e){ if(e.target===lb) close(); });
      document.addEventListener('keydown',function(e){ if(!lb.classList.contains('open')) return; if(e.key==='Escape') close(); else if(e.key==='ArrowLeft') show(cur-1); else if(e.key==='ArrowRight') show(cur+1); });
      var x0=null;
      lb.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
      lb.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) show(cur+(dx<0?1:-1)); x0=null; },{passive:true});
    }
  })();
  </script>
</body>
</html>
