<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event — CNT Promo &amp; Ads Specialists, Inc.</title>
  <meta name="description" content="Latest event and updates from CNT Promo & Ads Specialists, Inc." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/assets/img/icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <!-- Shared site header + footer (same as the homepage) -->
  <link rel="stylesheet" href="assets/site-chrome.css" />
  <script src="assets/site-chrome.js" defer></script>
  <style>
    :root{--red:#C8102E;--red-deep:#A50D24;--red-pale:#FFF0F2;--charcoal:#1A1A1A;--gray-400:#9CA3AF;--gray-600:#6B7280;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;color:#111;background:#FAFAFA;-webkit-font-smoothing:antialiased;line-height:1.7}
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%;height:auto}
    .container{width:min(760px,100% - 40px);margin-inline:auto}
    .article{padding:28px 0 80px}
    .backlink{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--gray-600);margin-bottom:20px}
    .backlink:hover{color:var(--red)}
    /* Banner hero — auto-styled; looks good with or without a photo */
    .hero{width:100%;margin-bottom:34px}
    .hero .banner{position:relative;width:min(1000px,100% - 40px);margin-inline:auto;min-height:clamp(240px,38vw,420px);border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#1A1A1A,#C8102E);box-shadow:0 18px 50px rgba(0,0,0,.16);display:flex;align-items:flex-end}
    .hero .banner>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .hero .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.74),rgba(0,0,0,.12) 58%,rgba(0,0,0,.04))}
    .hero .cap{position:relative;padding:clamp(22px,4vw,40px);width:100%}
    .hero .cap .pills{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .hero .cap .pill-date{font-size:.72rem;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--red);padding:5px 12px;border-radius:7px}
    .hero .cap .pill-cat{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:7px;backdrop-filter:blur(4px)}
    .hero .cap h1{font-family:'Manrope',sans-serif;font-size:clamp(1.6rem,4vw,2.7rem);font-weight:800;line-height:1.08;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.35)}
    .body p{font-size:1.06rem;color:#333;margin-bottom:1.15rem}
    .body img{width:100%;border-radius:14px;margin:14px 0;box-shadow:0 10px 34px rgba(0,0,0,.10)}
    /* Newspaper-style photo spread: a dominant lead image + a dense mosaic */
    .gallery-title{font-family:'Manrope',sans-serif;font-size:.95rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--charcoal);margin:40px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--red);display:inline-block}
    .gallery{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:96px;grid-auto-flow:dense;gap:10px}
    .gallery a{grid-column:span 2;grid-row:span 2;overflow:hidden;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);position:relative;background:#eee}
    .gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
    .gallery a:hover img{transform:scale(1.05)}
    .gallery a:first-child{grid-column:span 4;grid-row:span 4}
    .gallery a:nth-child(4n+3){grid-row:span 3}
    .gallery a:nth-child(6n+5){grid-column:span 3}
    @media(max-width:640px){
      .gallery{grid-template-columns:repeat(4,1fr);grid-auto-rows:78px}
      .gallery a:first-child{grid-column:span 4;grid-row:span 3}
      .gallery a:nth-child(6n+5){grid-column:span 2}
    }
    .state{padding:80px 0;text-align:center;color:var(--gray-600)}
    /* Lightbox — click a photo to open a full viewer with prev/next */
    .lb{position:fixed;inset:0;z-index:9000;background:rgba(10,10,12,.94);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .22s ease;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
    .lb.open{display:flex;opacity:1}
    .lb-stage{position:relative;width:min(1100px,92vw);height:min(84vh,900px);display:flex;align-items:center;justify-content:center}
    .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 24px 80px rgba(0,0,0,.6);user-select:none}
    .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s ease;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
    .lb-btn:hover{background:var(--red)}
    .lb-prev{left:-4px}.lb-next{right:-4px}
    .lb-close{position:absolute;top:20px;right:24px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;transition:background .18s ease}
    .lb-close:hover{background:var(--red)}
    .lb-count{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:.85rem;font-weight:700;letter-spacing:.06em;white-space:nowrap}
    .gallery a{cursor:zoom-in}
    @media(max-width:640px){.lb-btn{width:44px;height:44px}.lb-prev{left:2px}.lb-next{right:2px}}
  </style>
</head>
<body>
  <!-- Shared site header (injected by assets/site-chrome.js) -->
  <div id="site-header" data-active="events"></div>

  <main class="article">
    <div class="container">
      <a class="backlink" href="/#events"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>All events &amp; updates</a>
    </div>
    <div id="event-hero"></div>
    <div class="container">
      <div id="event-content"><div class="state">Loading…</div></div>
    </div>
  </main>

  <!-- Photo lightbox -->
  <div class="lb" id="lb" aria-hidden="true">
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <div class="lb-stage">
      <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <img id="lb-img" src="" alt="">
      <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <div class="lb-count" id="lb-count"></div>
    </div>
  </div>

  <!-- Shared site footer (injected by assets/site-chrome.js) -->
  <div id="site-footer"></div>

  <script>
  (function(){
    var yrEl=document.getElementById('yr'); if(yrEl) yrEl.textContent=new Date().getFullYear();
    var esc=function(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
    var el=document.getElementById('event-content');
    var hero=document.getElementById('event-hero');
    var id=new URLSearchParams(location.search).get('id');
    var sb=(window.getSupabase&&window.getSupabase());
    if(!id){ el.innerHTML='<div class="state">No event selected. <a href="/#events" style="color:var(--red);font-weight:600;">Back to events</a></div>'; return; }
    if(!sb){ el.innerHTML='<div class="state">Unable to load right now. Please try again later.</div>'; return; }
    sb.from('events').select('*').eq('id',id).eq('published',true).single().then(function(res){
      var ev=res.data;
      if(res.error||!ev){ el.innerHTML='<div class="state">This event was not found or is no longer available.<br><a href="/#events" style="color:var(--red);font-weight:600;">Back to events</a></div>'; return; }
      document.title=(ev.title||'Event')+' — CNT';
      // Count a view (once per browser session per event, so a refresh
      // doesn't inflate it). Fire-and-forget; never blocks the page.
      try{ var vk='cnt_ev_'+id; if(!sessionStorage.getItem(vk)){ sessionStorage.setItem(vk,'1'); Promise.resolve(sb.rpc('cnt_increment_event_view',{ev_id:Number(id)})).catch(function(){}); } }catch(_){}
      // Banner hero — auto-styled, works with or without a photo
      hero.className='hero';
      hero.innerHTML='<div class="banner">'
        +(ev.image_url?'<img src="'+esc(ev.image_url)+'" alt="'+esc(ev.title||'')+'">':'')
        +'<div class="scrim"></div>'
        +'<div class="cap"><div class="pills">'
          +(ev.event_date?'<span class="pill-date">'+esc(ev.event_date)+'</span>':'')
          +(ev.category?'<span class="pill-cat">'+esc(ev.category)+'</span>':'')
        +'</div><h1>'+esc(ev.title||'')+'</h1></div></div>';
      var paras=String(ev.body||ev.summary||'').split(/\n{1,}/).map(function(p){return p.trim();}).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
      var gallery='';
      var pics=Array.isArray(ev.images)?ev.images.filter(Boolean):[];
      if(pics.length){
        gallery='<h3 class="gallery-title">In Photos</h3><div class="gallery">'+pics.map(function(u,i){return '<a href="'+esc(u)+'" data-i="'+i+'"><img src="'+esc(u)+'" alt="Photo '+(i+1)+'" loading="lazy"></a>';}).join('')+'</div>';
      }
      el.innerHTML='<div class="body">'+(paras||'<p></p>')+'</div>'+gallery;
      if(pics.length) initLightbox(pics, el);
    });

    // Full-screen photo viewer: click any gallery photo, then step through
    // every uploaded image with the arrows, keyboard, or by tapping the edges.
    function initLightbox(pics, root){
      var lb=document.getElementById('lb'), img=document.getElementById('lb-img'),
          count=document.getElementById('lb-count'), cur=0;
      function show(i){
        cur=(i+pics.length)%pics.length;
        img.src=pics[cur];
        img.alt='Photo '+(cur+1)+' of '+pics.length;
        count.textContent=(cur+1)+' / '+pics.length;
      }
      function open(i){ show(i); lb.classList.add('open'); lb.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
      function close(){ lb.classList.remove('open'); lb.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
      root.querySelectorAll('.gallery a').forEach(function(a){
        a.addEventListener('click',function(e){ e.preventDefault(); open(+a.getAttribute('data-i')); });
      });
      document.getElementById('lb-prev').addEventListener('click',function(e){ e.stopPropagation(); show(cur-1); });
      document.getElementById('lb-next').addEventListener('click',function(e){ e.stopPropagation(); show(cur+1); });
      document.getElementById('lb-close').addEventListener('click',close);
      lb.addEventListener('click',function(e){ if(e.target===lb) close(); });
      document.addEventListener('keydown',function(e){
        if(!lb.classList.contains('open')) return;
        if(e.key==='Escape') close();
        else if(e.key==='ArrowLeft') show(cur-1);
        else if(e.key==='ArrowRight') show(cur+1);
      });
      // Swipe on touch devices
      var x0=null;
      lb.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
      lb.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) show(cur+(dx<0?1:-1)); x0=null; },{passive:true});
    }
  })();
  </script>

</body>
</html>
