<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — CNT Promo &amp; Ads Specialists, Inc.</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/assets/img/icon.png" />
  <link rel="stylesheet" href="assets/site-chrome.css" />
  <script src="assets/site-chrome.js" defer></script>
  <style>
    :root{--red:#C8102E;--red-deep:#A50D24;--red-lt:#E5213F;--charcoal:#1A1A1A;--ink:#161616;--sub:#4A4A4A;--muted:#6B7280;--line:#ECECEC}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    a{text-decoration:none;color:inherit}
    body{font-family:'Inter',sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
    .nf{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:clamp(56px,10vw,120px) 20px}
    .nf-inner{width:min(620px,100%)}
    .nf .code{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(5.5rem,20vw,10rem);line-height:.9;letter-spacing:-.04em;
      background:linear-gradient(135deg,#E5213F,#A50D24);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .nf h1{font-family:'Manrope',sans-serif;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;letter-spacing:-.02em;color:var(--charcoal);margin-top:.4rem}
    .nf p{color:var(--sub);margin:1rem auto 0;max-width:44ch;font-size:1.02rem;line-height:1.6}
    .nf .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:2.2rem}
    .nf .btn{font-weight:800;font-size:.92rem;padding:13px 24px;border-radius:12px;display:inline-flex;align-items:center;gap:.5rem;transition:transform .18s ease,background .18s ease}
    .nf .btn-red{background:var(--red);color:#fff}
    .nf .btn-red:hover{background:var(--red-deep);transform:translateY(-2px)}
    .nf .btn-ghost{border:1.5px solid var(--line);color:var(--charcoal)}
    .nf .btn-ghost:hover{border-color:var(--red);color:var(--red)}
    .nf .links{margin-top:2.4rem;padding-top:1.6rem;border-top:1px solid var(--line);display:flex;gap:22px;justify-content:center;flex-wrap:wrap;font-size:.88rem}
    .nf .links a{color:var(--muted);font-weight:600}
    .nf .links a:hover{color:var(--red)}
  </style>
</head>
<body>
  <div id="site-header" data-active=""></div>

  <main class="nf">
    <div class="nf-inner">
      <div class="code">404</div>
      <h1>This page took a different opportunity.</h1>
      <p>The page you're looking for was moved or no longer exists. Let's get you back on track.</p>
      <div class="btns">
        <a class="btn btn-red" href="/">Back to Home <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a class="btn btn-ghost" href="careers.html">Browse Jobs</a>
      </div>
      <div class="links">
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="status.html">Track My Application</a>
        <a href="/#contact">Contact</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
