<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Admin — CNT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link rel="icon" type="image/png" href="https://uploads.onecompiler.io/43d4zm644/44r932epq/icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <style>
    :root{--red:#C8102E;--red-deep:#A50D24;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;color:#0f172a;background:#f1f5f9;-webkit-font-smoothing:antialiased}
    .wrap{max-width:820px;margin:0 auto;padding:28px 18px 80px}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
    .brand h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.15rem;font-weight:800}
    .brand .material-icons-outlined{color:var(--red)}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden}
    .card-head{padding:16px 20px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .card-head h2{font-size:.95rem;font-weight:800}
    .card-head p{font-size:.72rem;color:#94a3b8}
    label{display:block;font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#64748b;margin-bottom:5px}
    input,textarea{width:100%;border:1px solid #e2e8f0;border-radius:9px;padding:9px 11px;font-size:.85rem;font-family:inherit}
    input:focus,textarea:focus{outline:none;border-color:var(--red)}
    textarea{resize:vertical}
    .btn{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-weight:700;font-size:.8rem;border:none;border-radius:9px;padding:9px 16px;cursor:pointer}
    .btn:hover{background:var(--red-deep)}
    .btn-ghost{background:#fff;color:#475569;border:1px solid #e2e8f0}
    .btn-ghost:hover{background:#f8fafc}
    .tabs{display:flex;gap:6px;margin-bottom:14px}
    .tabbtn{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 16px;font-size:.82rem;font-weight:700;color:#64748b;cursor:pointer}
    .tabbtn.on{background:var(--red);color:#fff;border-color:var(--red)}
    .row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid #f1f5f9}
    .row:first-child{border-top:none}
    .row .t{flex:1;min-width:0}
    .row .t b{font-weight:700;font-size:.9rem}
    .row .t small{display:block;color:#94a3b8;font-size:.72rem;margin-top:2px}
    .row a,.row button.link{font-size:.78rem;font-weight:700;cursor:pointer;background:none;border:none}
    .link-view{color:#4f46e5}.link-edit{color:#475569}.link-del{color:#ef4444}
    .draft{font-size:.6rem;font-weight:700;background:#f1f5f9;color:#64748b;padding:2px 7px;border-radius:99px;margin-left:6px}
    .muted{padding:26px;text-align:center;color:#94a3b8;font-size:.82rem}
    .field{margin-bottom:14px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:60}
    .modal.on{display:flex}
    .modal .box{background:#fff;border-radius:16px;max-width:560px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.25)}
    .modal .box-head{padding:16px 20px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;justify-content:space-between}
    .modal .box-head h3{font-size:.95rem;font-weight:800}
    .modal .box-body{padding:18px 20px;max-height:70vh;overflow-y:auto}
    .modal .box-foot{padding:14px 20px;border-top:1px solid #eef2f7;display:flex;justify-content:flex-end;gap:8px}
    .up{display:inline-flex;align-items:center;gap:5px;border:1px solid #e2e8f0;border-radius:9px;padding:9px 12px;font-size:.78rem;font-weight:600;color:#475569;cursor:pointer;white-space:nowrap}
    .up:hover{background:#f8fafc}
    .chk{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:#334155;cursor:pointer}
    .chk input{width:auto}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:.82rem;z-index:80;opacity:0;transition:.2s}
    .toast.on{opacity:1}
    .login{max-width:380px;margin:8vh auto 0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="material-icons-outlined">campaign</span><h1>CNT — Website Content</h1></div>

    <!-- LOGIN -->
    <div id="login-view" style="display:none;">
      <div class="card login">
        <div class="card-head"><h2>Super admin sign in</h2></div>
        <div style="padding:20px;">
          <form id="login-form">
            <div class="field"><label>Email</label><input id="li-email" type="email" required autocomplete="username"></div>
            <div class="field"><label>Password</label><input id="li-pass" type="password" required autocomplete="current-password"></div>
            <button class="btn" type="submit" style="width:100%;justify-content:center;">Sign in</button>
            <p id="li-msg" style="color:#ef4444;font-size:.78rem;margin-top:10px;text-align:center;"></p>
          </form>
        </div>
      </div>
    </div>

    <!-- NOT AUTHORIZED -->
    <div id="denied-view" style="display:none;">
      <div class="card"><div class="muted">This page is for super admins only. <button class="link link-view" onclick="cntLogout()">Sign out</button></div></div>
    </div>

    <!-- MANAGER -->
    <div id="manager-view" style="display:none;">
      <div class="tabs">
        <button id="tab-events" class="tabbtn on" onclick="showTab('events')">Events &amp; Updates</button>
        <button id="tab-stories" class="tabbtn" onclick="showTab('stories')">Success Stories</button>
      </div>

      <div id="panel-events" class="card">
        <div class="card-head">
          <div><h2>Events &amp; Updates</h2><p>News, job fairs, achievements — shown on the homepage with a detail page.</p></div>
          <button class="btn" style="margin-left:auto;" onclick="evForm()"><span class="material-icons-outlined" style="font-size:16px;">add</span>New post</button>
        </div>
        <div id="ev-list"><div class="muted">Loading…</div></div>
      </div>

      <div id="panel-stories" class="card" style="display:none;">
        <div class="card-head">
          <div><h2>Success Stories</h2><p>Client wins &amp; case studies shown on the homepage.</p></div>
          <button class="btn" style="margin-left:auto;" onclick="stForm()"><span class="material-icons-outlined" style="font-size:16px;">add</span>New story</button>
        </div>
        <div id="st-list"><div class="muted">Loading…</div></div>
      </div>

      <p style="text-align:right;margin-top:12px;"><button class="link" onclick="cntLogout()" style="font-size:.75rem;color:#94a3b8;">Sign out</button></p>
    </div>
  </div>

  <!-- EVENT MODAL -->
  <div class="modal" id="ev-modal">
    <div class="box">
      <div class="box-head"><h3 id="ev-modal-title">New post</h3><button class="up" style="border:none;padding:4px;" onclick="evClose()"><span class="material-icons-outlined">close</span></button></div>
      <div class="box-body">
        <input type="hidden" id="ev-id">
        <div class="field"><label>Title *</label><input id="ev-title"></div>
        <div class="grid2">
          <div class="field"><label>Category</label><input id="ev-category" list="ev-cats" placeholder="Hiring Drive"><datalist id="ev-cats"><option>Hiring Drive</option><option>Announcement</option><option>Achievement</option><option>Milestone</option><option>Job Fair</option><option>Update</option></datalist></div>
          <div class="field"><label>Date label</label><input id="ev-date" placeholder="Aug 2026"></div>
        </div>
        <div class="field"><label>Image (upload or paste a URL)</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <label class="up"><span class="material-icons-outlined" style="font-size:16px;">upload</span>Upload<input type="file" accept="image/*" style="display:none;" onchange="imgUpload(this,'ev-image','ev-preview')"></label>
            <input id="ev-image" placeholder="https://…" style="flex:1;">
          </div>
          <div id="ev-preview"></div>
        </div>
        <div class="field"><label>Summary — short blurb on the card</label><textarea id="ev-summary" rows="2"></textarea></div>
        <div class="field"><label>Full details — shown on the detail page</label><textarea id="ev-body" rows="6"></textarea></div>
        <label class="chk"><input type="checkbox" id="ev-published" checked> Published (visible on the website)</label>
      </div>
      <div class="box-foot"><button class="btn btn-ghost" onclick="evClose()">Cancel</button><button class="btn" onclick="evSave()">Save post</button></div>
    </div>
  </div>

  <!-- STORY MODAL -->
  <div class="modal" id="st-modal">
    <div class="box">
      <div class="box-head"><h3 id="st-modal-title">New story</h3><button class="up" style="border:none;padding:4px;" onclick="stClose()"><span class="material-icons-outlined">close</span></button></div>
      <div class="box-body">
        <input type="hidden" id="st-id">
        <div class="field"><label>Title *</label><input id="st-title" placeholder="Metro Bank: 200-Person Branch Rollout"></div>
        <div class="field"><label>Category / sector</label><input id="st-category" placeholder="Banking &amp; Finance"></div>
        <div class="field"><label>Image (upload or paste a URL)</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <label class="up"><span class="material-icons-outlined" style="font-size:16px;">upload</span>Upload<input type="file" accept="image/*" style="display:none;" onchange="imgUpload(this,'st-image','st-preview')"></label>
            <input id="st-image" placeholder="https://…" style="flex:1;">
          </div>
          <div id="st-preview"></div>
        </div>
        <div class="field"><label>Result / description</label><textarea id="st-desc" rows="3" placeholder="Recruited and onboarded 200 branch staff across 15 new locations in 60 days"></textarea></div>
        <label class="chk"><input type="checkbox" id="st-published" checked> Published (visible on the website)</label>
      </div>
      <div class="box-foot"><button class="btn btn-ghost" onclick="stClose()">Cancel</button><button class="btn" onclick="stSave()">Save story</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function(){
    var sb = window.getSupabase && window.getSupabase();
    var _ev = [], _st = [];
    var esc = function(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
    var show = function(id){ ['login-view','denied-view','manager-view'].forEach(function(v){ document.getElementById(v).style.display = v===id?'block':'none'; }); };
    var toast = function(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},2600); };

    window.showTab = function(t){
      document.getElementById('panel-events').style.display = t==='events'?'block':'none';
      document.getElementById('panel-stories').style.display = t==='stories'?'block':'none';
      document.getElementById('tab-events').classList.toggle('on', t==='events');
      document.getElementById('tab-stories').classList.toggle('on', t==='stories');
    };

    async function check(){
      if(!sb){ show('denied-view'); return; }
      var s = await sb.auth.getSession();
      if(!s.data.session){ show('login-view'); return; }
      var r = await sb.rpc('cnt_is_super_admin');
      if(r.error || !r.data){ show('denied-view'); return; }
      show('manager-view'); evLoad(); stLoad();
    }

    // shared image uploader → public event-images bucket
    window.imgUpload = async function(input, imgId, prevId){
      var f = input && input.files && input.files[0]; if(!f) return;
      if(!/^image\//.test(f.type)){ toast('Please choose an image file.'); input.value=''; return; }
      if(f.size>5*1048576){ toast('Image is larger than 5 MB.'); input.value=''; return; }
      var ext=((f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''))||'jpg';
      var path='events/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
      toast('Uploading image…');
      var up = await sb.storage.from('event-images').upload(path,f,{cacheControl:'3600',upsert:false});
      if(up.error){ toast('Upload failed: '+up.error.message); return; }
      var url = sb.storage.from('event-images').getPublicUrl(path).data.publicUrl;
      document.getElementById(imgId).value = url;
      document.getElementById(prevId).innerHTML = '<img src="'+esc(url)+'" alt="" style="max-height:120px;border-radius:8px;margin-top:8px;">';
      toast('Image uploaded');
    };

    // ── EVENTS ──
    async function evLoad(){
      var el=document.getElementById('ev-list'); el.innerHTML='<div class="muted">Loading…</div>';
      var res = await sb.from('events').select('*').order('created_at',{ascending:false});
      if(res.error){ el.innerHTML='<div class="muted">'+esc(res.error.message)+'</div>'; return; }
      _ev = res.data||[];
      if(!_ev.length){ el.innerHTML='<div class="muted">No posts yet. Click “New post”.</div>'; return; }
      el.innerHTML=_ev.map(function(ev){
        return '<div class="row"><div class="t"><b>'+esc(ev.title||'')+(ev.published?'':'<span class="draft">Draft</span>')+'</b>'
          +'<small>'+esc(ev.event_date||'')+(ev.category?(' · '+esc(ev.category)):'')+'</small></div>'
          +'<a class="link-view" href="event.html?id='+ev.id+'" target="_blank">View</a>'
          +'<button class="link link-edit" onclick="evForm('+ev.id+')">Edit</button>'
          +'<button class="link link-del" onclick="evDelete('+ev.id+')">Delete</button></div>';
      }).join('');
    }
    window.evForm = function(id){
      var ev = id ? (_ev.filter(function(x){return x.id===id;})[0]||{}) : {};
      document.getElementById('ev-modal-title').textContent = id?'Edit post':'New post';
      document.getElementById('ev-id').value = id||'';
      document.getElementById('ev-title').value = ev.title||'';
      document.getElementById('ev-category').value = ev.category||'';
      document.getElementById('ev-date').value = ev.event_date||'';
      document.getElementById('ev-image').value = ev.image_url||'';
      document.getElementById('ev-summary').value = ev.summary||'';
      document.getElementById('ev-body').value = ev.body||'';
      document.getElementById('ev-published').checked = id ? !!ev.published : true;
      document.getElementById('ev-preview').innerHTML = ev.image_url?'<img src="'+esc(ev.image_url)+'" alt="" style="max-height:120px;border-radius:8px;margin-top:8px;">':'';
      document.getElementById('ev-modal').classList.add('on');
    };
    window.evClose = function(){ document.getElementById('ev-modal').classList.remove('on'); };
    window.evSave = async function(){
      var id = document.getElementById('ev-id').value;
      var row = { title:document.getElementById('ev-title').value.trim(), category:document.getElementById('ev-category').value.trim()||null,
        event_date:document.getElementById('ev-date').value.trim()||null, image_url:document.getElementById('ev-image').value.trim()||null,
        summary:document.getElementById('ev-summary').value.trim()||null, body:document.getElementById('ev-body').value.trim()||null,
        published:document.getElementById('ev-published').checked };
      if(!row.title){ toast('Title is required'); return; }
      var res = id ? await sb.from('events').update(row).eq('id',id) : await sb.from('events').insert(row);
      if(res.error){ toast('Save failed: '+res.error.message); return; }
      evClose(); evLoad(); toast(id?'Post updated':'Post published');
    };
    window.evDelete = async function(id){
      var ev = _ev.filter(function(x){return x.id===id;})[0];
      if(!confirm('Delete "'+(ev?ev.title:'this post')+'" from the website?')) return;
      var res = await sb.from('events').delete().eq('id',id);
      if(res.error){ toast('Delete failed: '+res.error.message); return; }
      evLoad(); toast('Post deleted');
    };

    // ── SUCCESS STORIES ──
    async function stLoad(){
      var el=document.getElementById('st-list'); el.innerHTML='<div class="muted">Loading…</div>';
      var res = await sb.from('stories').select('*').order('created_at',{ascending:false});
      if(res.error){ el.innerHTML='<div class="muted">'+esc(res.error.message)+'</div>'; return; }
      _st = res.data||[];
      if(!_st.length){ el.innerHTML='<div class="muted">No stories yet. Click “New story”.</div>'; return; }
      el.innerHTML=_st.map(function(s){
        return '<div class="row"><div class="t"><b>'+esc(s.title||'')+(s.published?'':'<span class="draft">Draft</span>')+'</b>'
          +'<small>'+esc(s.category||'')+'</small></div>'
          +'<button class="link link-edit" onclick="stForm('+s.id+')">Edit</button>'
          +'<button class="link link-del" onclick="stDelete('+s.id+')">Delete</button></div>';
      }).join('');
    }
    window.stForm = function(id){
      var s = id ? (_st.filter(function(x){return x.id===id;})[0]||{}) : {};
      document.getElementById('st-modal-title').textContent = id?'Edit story':'New story';
      document.getElementById('st-id').value = id||'';
      document.getElementById('st-title').value = s.title||'';
      document.getElementById('st-category').value = s.category||'';
      document.getElementById('st-image').value = s.image_url||'';
      document.getElementById('st-desc').value = s.description||'';
      document.getElementById('st-published').checked = id ? !!s.published : true;
      document.getElementById('st-preview').innerHTML = s.image_url?'<img src="'+esc(s.image_url)+'" alt="" style="max-height:120px;border-radius:8px;margin-top:8px;">':'';
      document.getElementById('st-modal').classList.add('on');
    };
    window.stClose = function(){ document.getElementById('st-modal').classList.remove('on'); };
    window.stSave = async function(){
      var id = document.getElementById('st-id').value;
      var row = { title:document.getElementById('st-title').value.trim(), category:document.getElementById('st-category').value.trim()||null,
        image_url:document.getElementById('st-image').value.trim()||null, description:document.getElementById('st-desc').value.trim()||null,
        published:document.getElementById('st-published').checked };
      if(!row.title){ toast('Title is required'); return; }
      var res = id ? await sb.from('stories').update(row).eq('id',id) : await sb.from('stories').insert(row);
      if(res.error){ toast('Save failed: '+res.error.message); return; }
      stClose(); stLoad(); toast(id?'Story updated':'Story published');
    };
    window.stDelete = async function(id){
      var s = _st.filter(function(x){return x.id===id;})[0];
      if(!confirm('Delete "'+(s?s.title:'this story')+'" from the website?')) return;
      var res = await sb.from('stories').delete().eq('id',id);
      if(res.error){ toast('Delete failed: '+res.error.message); return; }
      stLoad(); toast('Story deleted');
    };

    window.cntLogout = async function(){ if(sb) await sb.auth.signOut(); show('login-view'); };

    document.getElementById('login-form').addEventListener('submit', async function(e){
      e.preventDefault();
      var msg=document.getElementById('li-msg'); msg.textContent='';
      var res = await sb.auth.signInWithPassword({ email: document.getElementById('li-email').value.trim(), password: document.getElementById('li-pass').value });
      if(res.error){ msg.textContent = res.error.message; return; }
      check();
    });

    check();
  })();
  </script>
</body>
</html>
