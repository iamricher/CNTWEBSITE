<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights — CNT Promo &amp; Ads Specialists, Inc.</title>
  <meta name="description" content="Hiring insights, labor-market notes, and career advice from the CNT recruitment team." />
  <link rel="canonical" href="https://cnt-website-ats.vercel.app/insights.html" />
  <meta property="og:title" content="Insights — CNT Promo & Ads Specialists, Inc." />
  <meta property="og:description" content="Hiring insights, labor-market notes, and career advice from the CNT recruitment team." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="https://uploads.onecompiler.io/43d4zm644/44r932epq/icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <link rel="stylesheet" href="assets/site-chrome.css" />
  <script src="assets/site-chrome.js" defer></script>
  <style>
    :root{--red:#C8102E;--red-deep:#A50D24;--red-lt:#E5213F;--charcoal:#1A1A1A;--ink:#161616;--sub:#4A4A4A;--muted:#6B7280;--line:#ECECEC;--bg:#FBFAF8}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.7}
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%}
    .wrap{width:min(1140px,100% - 44px);margin-inline:auto}
    /* Editorial masthead */
    .masthead{padding:clamp(56px,9vw,104px) 0 clamp(30px,5vw,52px);border-bottom:1px solid var(--line)}
    .masthead .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:1.1rem;display:flex;align-items:center;gap:.7rem}
    .masthead .eyebrow::before{content:'';width:30px;height:2px;background:var(--red)}
    .masthead h1{font-family:'Manrope',sans-serif;font-optical-sizing:auto;font-size:clamp(2.6rem,7vw,4.8rem);font-weight:500;line-height:1.02;letter-spacing:-.02em;color:var(--charcoal)}
    .masthead h1 em{font-style:italic;color:var(--red)}
    .masthead p{margin-top:1.2rem;max-width:56ch;color:var(--sub);font-size:clamp(1rem,2vw,1.16rem)}
    /* Grid of posts */
    .feed{padding:clamp(40px,6vw,68px) 0 clamp(70px,10vw,120px)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,3vw,36px)}
    /* Featured lead spans the full width */
    .card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}
    .card:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(0,0,0,.10)}
    .card .thumb{aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,#1A1A1A,#C8102E)}
    .card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
    .card:hover .thumb img{transform:scale(1.05)}
    .card .pad{padding:22px 24px 26px;display:flex;flex-direction:column;flex:1}
    .card .cat{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:11px}
    .card h3{font-family:'Manrope',sans-serif;font-optical-sizing:auto;font-size:1.32rem;font-weight:600;line-height:1.18;letter-spacing:-.01em;color:var(--charcoal)}
    .card p{margin-top:10px;color:var(--sub);font-size:.95rem;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card .meta{margin-top:auto;padding-top:16px;font-size:.82rem;color:var(--muted);display:flex;gap:9px;align-items:center}
    .card .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
    .card.lead{grid-column:1 / -1;flex-direction:row}
    .card.lead .thumb{flex:0 0 52%;aspect-ratio:auto}
    .card.lead .pad{justify-content:center;padding:clamp(26px,4vw,52px)}
    .card.lead .cat{font-size:.72rem}
    .card.lead h3{font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.08}
    .card.lead p{-webkit-line-clamp:3;font-size:1.05rem;margin-top:14px}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.card.lead{flex-direction:column}.card.lead .thumb{flex:none;aspect-ratio:16/9;width:100%}}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
    .state{padding:90px 0;text-align:center;color:var(--muted)}
    .state svg{margin:0 auto 18px;color:var(--red);opacity:.35}
  </style>
</head>
<body>
  <div id="site-header" data-active="insights"></div>

  <header class="masthead">
    <div class="wrap">
      <div class="eyebrow">CNT Insights</div>
      <h1>Notes on hiring,<br><em>talent &amp; work.</em></h1>
      <p>Practical thinking from the people who fill roles every day — market signals, hiring playbooks, and honest career advice for jobseekers and employers alike.</p>
    </div>
  </header>

  <main class="feed">
    <div class="wrap">
      <div class="grid" id="feed"><div class="state">Loading insights…</div></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
  (function(){
    var esc=function(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
    var feed=document.getElementById('feed');
    var sb=(window.getSupabase&&window.getSupabase());
    var fmt=function(s){ if(!s) return ''; try{ return new Date(s).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }catch(_){ return ''; } };
    var readTime=function(t){ var w=String(t||'').trim().split(/\s+/).filter(Boolean).length; return Math.max(1,Math.round(w/200))+' min read'; };

    if(!sb){ feed.innerHTML='<div class="state">Unable to load right now. Please try again later.</div>'; return; }

    sb.from('posts').select('id,title,excerpt,cover_image,category,author,publish_at,created_at,body')
      .eq('published',true).order('publish_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false})
      .then(function(res){
        var rows=(res.data||[]).filter(function(p){ return !p.publish_at || new Date(p.publish_at)<=new Date(); });
        if(res.error||!rows.length){
          feed.innerHTML='<div class="state"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><br>No insights published yet. Check back soon.</div>';
          return;
        }
        feed.innerHTML=rows.map(function(p,i){
          var lead=i===0?' lead':'';
          var href='post.html?id='+encodeURIComponent(p.id);
          var thumb=p.cover_image?'<img src="'+esc(p.cover_image)+'" alt="'+esc(p.title||'')+'" loading="'+(i<3?'eager':'lazy')+'">':'';
          return '<a class="card'+lead+'" href="'+href+'">'
            +'<div class="thumb">'+thumb+'</div>'
            +'<div class="pad">'
              +(p.category?'<div class="cat">'+esc(p.category)+'</div>':'')
              +'<h3>'+esc(p.title||'')+'</h3>'
              +(p.excerpt?'<p>'+esc(p.excerpt)+'</p>':'')
              +'<div class="meta">'
                +(p.author?'<span>'+esc(p.author)+'</span><span class="dot"></span>':'')
                +'<span>'+esc(fmt(p.publish_at||p.created_at))+'</span><span class="dot"></span><span>'+readTime(p.body)+'</span>'
              +'</div>'
            +'</div></a>';
        }).join('');
      });
  })();
  </script>
</body>
</html>
