<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services — CNT Promo &amp; Ads Specialists, Inc.</title>
  <meta name="description" content="Explore CNT's staffing, HR, and talent solutions for businesses across the Philippines." />
  <meta property="og:title" content="Services — CNT Promo & Ads Specialists, Inc." />
  <meta property="og:description" content="Staffing, HR outsourcing, and talent solutions built around your business." />
  <meta property="og:image" content="https://www.cntpromoads.com.ph/assets/img/og-cover.jpg" />
  <meta property="og:type" content="website" />

  <link rel="icon" href="/assets/img/icon.png" />
  <link rel="preconnect" href="https://mtaknpmvvldmnsizvtuy.supabase.co" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>

  <!-- Shared site header + footer -->
  <link rel="stylesheet" href="assets/site-chrome.css" />
  <script src="assets/site-chrome.js" defer></script>

  <style>
    :root{
      --red:#C8102E; --red-lt:#E5213F; --red-deep:#A50D24;
      --ink:#111318; --slate:#3a4250; --muted:#5b6472; --line:#E7EAF0; --bg:#fff; --gray-50:#F7F8FA;
      --font-display:'Manrope',sans-serif; --font-body:'Inter',sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(1120px,100% - 40px);margin-inline:auto}
    @keyframes cntPulse{0%{box-shadow:0 0 0 3px rgba(229,33,63,.18),0 0 9px rgba(229,33,63,.7)}70%{box-shadow:0 0 0 8px rgba(229,33,63,0),0 0 9px rgba(229,33,63,0)}100%{box-shadow:0 0 0 3px rgba(229,33,63,0)}}

    /* Dark hero (overlay nav sits over it — matches every other page) */
    .svc-detail-hero{position:relative;overflow:hidden;color:#fff;
      background:radial-gradient(130% 130% at 100% 0%,rgba(95,22,30,.5) 0%,transparent 46%),linear-gradient(110deg,#14161b 0%,#111318 52%,#0e0f13 100%);
      padding:clamp(66px,9vw,112px) 0 clamp(44px,6vw,72px)}
    .svc-detail-hero::after{content:"";position:absolute;right:-8%;top:-34%;width:540px;height:540px;border-radius:50%;background:radial-gradient(circle,rgba(229,33,63,.28),transparent 62%);pointer-events:none}
    .svc-detail-hero .wrap{position:relative;z-index:1}
    .svc-back{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;font-weight:700;color:rgba(255,255,255,.7);transition:color .15s}
    .svc-back:hover{color:#fff}
    .svc-back svg{width:16px;height:16px}
    .svc-hero-ic{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;margin:clamp(20px,3vw,30px) 0 18px;
      background:linear-gradient(180deg,rgba(229,33,63,.22),rgba(229,33,63,.06));border:1px solid rgba(229,33,63,.34)}
    .svc-hero-ic svg{width:28px;height:28px;stroke:#FF6675}
    .svc-kick{display:inline-flex;align-items:center;gap:.5rem;font-size:.68rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.86);line-height:1;padding:.42rem .82rem .42rem .68rem;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015))}
    .svc-kick::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;flex:none;background:var(--red-lt);box-shadow:0 0 0 3px rgba(229,33,63,.18),0 0 9px rgba(229,33,63,.7);animation:cntPulse 2.2s ease-out infinite}
    @media(prefers-reduced-motion:reduce){.svc-kick::before{animation:none}}
    .svc-detail-hero h1{font-family:var(--font-display);font-size:clamp(2.3rem,5.6vw,3.9rem);font-weight:800;letter-spacing:-.03em;line-height:1.04;margin:16px 0 0;max-width:18ch}
    .svc-detail-hero h1 em{font-style:normal;background:linear-gradient(100deg,#FF3D51 0%,#E5213F 38%,#C8102E 72%,#A50D24 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .svc-detail-hero .tagline{color:rgba(255,255,255,.72);margin-top:1.15rem;font-size:clamp(1.02rem,1.7vw,1.2rem);line-height:1.6;max-width:60ch}
    .svc-hero-cta{display:inline-flex;align-items:center;gap:.5rem;margin-top:clamp(24px,4vw,34px);background:linear-gradient(100deg,#FF3D51 0%,#E5213F 38%,#C8102E 72%,#A50D24 100%);color:#fff;font-family:var(--font-display);font-weight:800;font-size:.95rem;padding:14px 26px;border-radius:12px;box-shadow:0 10px 26px -8px rgba(200,16,46,.6);transition:transform .18s,box-shadow .18s}
    .svc-hero-cta:hover{transform:translateY(-2px);box-shadow:0 16px 34px -10px rgba(200,16,46,.7)}
    .svc-hero-cta svg{width:17px;height:17px}

    /* Body sections */
    .sec{padding:clamp(52px,7vw,84px) 0}
    .sec-gray{background:var(--gray-50)}
    .sec-head .k{font-family:var(--font-display);font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
    .sec-head h2{font-family:var(--font-display);font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:.5rem 0 0}
    .sec-head p{color:var(--muted);font-size:1.06rem;line-height:1.7;margin:1rem 0 0;max-width:64ch}

    .hi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:clamp(28px,4vw,42px)}
    .hi-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 22px;transition:transform .2s,box-shadow .2s,border-color .2s}
    .hi-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(16,24,40,.28);border-color:#DfE4EC}
    .hi-rate{position:absolute;top:18px;right:18px;display:inline-flex;align-items:center;gap:4px;background:#FFF7E6;color:#B7791F;border:1px solid #F3E2BC;border-radius:100px;padding:4px 10px 4px 8px;font-size:.78rem;font-weight:800;line-height:1}
    .hi-rate svg{width:13px;height:13px;color:#F0A91C}
    /* Partners / trusted-by — animated multi-row logo marquee */
    .pmq{position:relative;margin:clamp(26px,3.6vw,46px) auto 0;max-width:1020px;display:flex;flex-direction:column;gap:clamp(12px,1.8vw,24px);padding:clamp(24px,3.4vw,44px) 0;border-radius:24px;background:radial-gradient(130% 150% at 50% -10%,#ffffff 0%,#f6f8fc 72%);border:1px solid var(--line);box-shadow:0 30px 70px -40px rgba(16,24,40,.38);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
    .pmq-row{display:flex;width:max-content;flex:none;animation:pmqL linear infinite;will-change:transform;filter:grayscale(.3) opacity(.88);transition:filter .5s ease}
    .pmq-row.rev{animation-name:pmqR}
    .pmq-row img{flex:none;height:clamp(32px,4.4vw,50px);width:auto;display:block;margin:0 clamp(22px,2.6vw,42px)}
    .pmq:hover .pmq-row{filter:grayscale(0) opacity(1);animation-play-state:paused}
    @keyframes pmqL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    @keyframes pmqR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
    @media (prefers-reduced-motion:reduce){.pmq-row{animation:none;filter:grayscale(0) opacity(1);justify-content:center}.pmq-row img:nth-child(2){display:none}}
    /* Testimonials / quotes */
    .svc-quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(16px,2vw,22px);margin-top:clamp(28px,4vw,42px)}
    .svc-quote{position:relative;margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 24px 22px;transition:transform .2s,box-shadow .2s}
    .svc-quote:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(16,24,40,.25)}
    .svc-quote::before{content:"\201C";position:absolute;top:2px;left:18px;font-family:Georgia,serif;font-size:3.4rem;line-height:1;color:var(--red);opacity:.16}
    .svc-quote blockquote{margin:14px 0 0;font-size:1rem;line-height:1.62;color:var(--slate);font-style:italic}
    .svc-quote figcaption{margin-top:14px;font-size:.82rem;font-weight:700;color:var(--muted);font-style:normal}
    /* feedback carousel — matches homepage testimonials */
    .tq{position:relative;margin-top:clamp(28px,4vw,42px)}
    .tq-stage{position:relative;padding:0 62px}
    .tq-vp{overflow:hidden;padding:6px 0 8px}
    .tq-track{display:flex;transition:transform .55s cubic-bezier(.4,.01,.2,1);will-change:transform}
    .tq-slide{flex:0 0 50%;min-width:0;padding:0 11px;box-sizing:border-box;display:flex}
    .tq .svc-quote{width:100%;margin:0;display:flex;flex-direction:column;padding:34px 34px 30px;border-radius:20px;box-shadow:0 2px 10px rgba(16,24,40,.06)}
    .tq .svc-quote:hover{transform:translateY(-3px);box-shadow:0 22px 46px -26px rgba(16,24,40,.26)}
    .tq .svc-quote::before{display:none}
    .tq-stars{color:#EF4444;font-size:1rem;letter-spacing:3px;line-height:1;margin-bottom:16px}
    .tq .svc-quote blockquote{margin:0 0 18px;font-size:1.02rem;line-height:1.75;color:var(--slate);font-style:italic}
    .tq-author{display:flex;align-items:center;gap:14px;margin-top:auto}
    .tq-avatar{width:48px;height:48px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;flex-shrink:0;font-family:var(--font-display);font-size:.9rem;font-weight:800;letter-spacing:.01em}
    .tq-meta strong{display:block;font-size:.92rem;font-weight:800;color:var(--ink);line-height:1.3}
    .tq-meta span{display:block;margin-top:2px;font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
    .tq-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--red);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px -10px rgba(16,24,40,.35);transition:transform .18s,box-shadow .18s,border-color .18s;z-index:2}
    .tq-nav:hover{border-color:#F3C6CC;transform:translateY(-50%) scale(1.08);box-shadow:0 16px 34px -14px rgba(200,16,46,.38)}
    .tq-nav:active{transform:translateY(-50%) scale(.96)}
    .tq-nav svg{width:20px;height:20px}
    .tq-prev{left:0}
    .tq-next{right:0}
    .tq-dots{display:flex;justify-content:center;gap:9px;margin-top:26px}
    .tq-dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:#D7DCE4;cursor:pointer;transition:width .25s,background .25s}
    .tq-dot:hover{background:#B9C0CC}
    .tq-dot.on{width:26px;border-radius:5px;background:var(--red)}
    @media(max-width:720px){.tq-slide{flex:0 0 100%}}
    @media(max-width:620px){.tq-stage{padding:0}.tq-nav{display:none}.tq .svc-quote{padding:28px 24px 26px}}
    @media(prefers-reduced-motion:reduce){.tq-track{transition:none}}
    .hi-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#FDE7EA;color:var(--red);margin-bottom:14px}
    .hi-ic svg{width:20px;height:20px}
    .hi-card h3{font-family:var(--font-display);font-size:1.06rem;font-weight:800;letter-spacing:-.01em;margin:0 0 7px}
    .hi-card p{color:var(--muted);font-size:.93rem;line-height:1.6;margin:0}

    /* Video embed (responsive 16:9) */
    .svc-video{position:relative;width:100%;aspect-ratio:16/9;margin-top:clamp(28px,4vw,42px);border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 14px 40px -16px rgba(16,24,40,.35)}
    .svc-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
    /* Experts / SMEs cards */
    .svc-experts{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(18px,2.6vw,34px);margin-top:clamp(28px,4vw,46px)}
    .svc-expert{margin:0;text-align:center;width:clamp(178px,24vw,244px);opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
    .svc-experts.in .svc-expert{opacity:1;transform:none}
    .svc-experts.in .svc-expert:nth-child(2){transition-delay:.08s}
    .svc-experts.in .svc-expert:nth-child(3){transition-delay:.16s}
    .svc-experts.in .svc-expert:nth-child(4){transition-delay:.24s}
    .svc-experts.in .svc-expert:nth-child(5){transition-delay:.32s}
    .svc-experts.in .svc-expert:nth-child(6){transition-delay:.40s}
    .svc-expert .pic{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--gray-50);box-shadow:0 8px 24px -14px rgba(16,24,40,.3);transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s ease}
    .svc-expert .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.22,1,.36,1)}
    .svc-expert .pic.noimg{display:grid;place-items:center;color:var(--line)}
    .svc-expert .pic.noimg svg{width:42%;height:42%}
    .svc-expert:hover .pic{transform:translateY(-6px);box-shadow:0 26px 50px -20px rgba(16,24,40,.42)}
    .svc-expert:hover .pic img{transform:scale(1.06)}
    .svc-expert figcaption{margin-top:14px;font-weight:700;font-size:1.02rem;color:var(--ink);line-height:1.3}
    .svc-expert .role{display:block;margin-top:3px;font-weight:500;font-size:.85rem;color:var(--muted)}
    @media (prefers-reduced-motion:reduce){.svc-expert{opacity:1;transform:none;transition:none}.svc-expert .pic,.svc-expert .pic img{transition:none}.svc-expert:hover .pic,.svc-expert:hover .pic img{transform:none}}
    /* Photo gallery */
    .svc-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:clamp(28px,4vw,42px)}
    .svc-gallery figure{margin:0;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--gray-50);border:1px solid var(--line)}
    .svc-gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
    .svc-gallery figure{cursor:zoom-in;position:relative}
    .svc-gallery figure:hover img{transform:scale(1.06)}
    .svc-gallery figure::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,13,0) 55%,rgba(8,9,13,.28) 100%);opacity:0;transition:opacity .3s ease;pointer-events:none}
    .svc-gallery figure:hover::after{opacity:1}

    /* Lightbox — uniform with the event gallery viewer */
    .lb{position:fixed;inset:0;z-index:9000;background:rgba(10,10,12,.94);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .22s ease;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
    .lb.open{display:flex;opacity:1}
    /* Stage is narrowed so the arrows live in the side gutters, never over the photo */
    .lb-stage{position:relative;width:min(1100px,calc(100vw - 168px));height:min(84vh,900px);display:flex;align-items:center;justify-content:center}
    .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 24px 80px rgba(0,0,0,.6);user-select:none}
    .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s ease;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
    .lb-btn:hover{background:var(--red)}
    .lb-prev{left:-66px}.lb-next{right:-66px}
    .lb-close{position:absolute;top:20px;right:24px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;transition:background .18s ease}
    .lb-close:hover{background:var(--red)}
    .lb-count{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:.85rem;font-weight:700;letter-spacing:.06em;white-space:nowrap}
    @media(max-width:640px){.lb-stage{width:calc(100vw - 112px)}.lb-btn{width:44px;height:44px}.lb-prev{left:-50px}.lb-next{right:-50px}}

    /* Who it's for — audience chips */
    .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(22px,3vw,30px)}
    .chip{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.05rem;border-radius:999px;background:#fff;border:1px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:.92rem;color:var(--ink);box-shadow:0 1px 2px rgba(16,18,24,.04)}
    .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
    .sec-gray .chip{background:#fff}

    /* Scope — what's covered checklist */
    .scope{list-style:none;margin:clamp(22px,3vw,30px) 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 30px}
    .scope li{display:flex;gap:12px;align-items:flex-start;font-size:.98rem;line-height:1.5;color:var(--ink)}
    .scope li svg{width:20px;height:20px;flex:none;color:var(--red);margin-top:1px}
    .scope.scope-mt{margin-top:clamp(20px,2.6vw,30px)}
    /* Tiered level cards (e.g. training levels) */
    .svc-levels{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(12px,1.4vw,18px);margin-top:clamp(24px,3vw,36px)}
    @media(max-width:880px){.svc-levels{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:560px){.svc-levels{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:400px){.svc-levels{grid-template-columns:1fr}}
    .lvl{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 22px 20px;transition:transform .2s,box-shadow .2s,border-color .2s}
    .lvl:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(16,24,40,.28);border-color:#DfE4EC}
    .lvl-n{font-family:var(--font-display);font-size:2.3rem;font-weight:800;line-height:1;letter-spacing:-.02em;background:linear-gradient(130deg,#FF3D51,#C8102E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .lvl h3{font-family:var(--font-display);font-size:1.1rem;font-weight:800;letter-spacing:-.01em;margin:9px 0 7px;color:var(--ink)}
    .lvl p{color:var(--muted);font-size:.93rem;line-height:1.55;margin:0}

    /* By the numbers — stats band */
    .svc-stats{background:linear-gradient(158deg,#141319,#0e0d12);color:#fff;padding:clamp(40px,6vw,64px) 0}
    .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:clamp(24px,5vw,48px);text-align:center}
    .svc-stats .stat b{font-family:var(--font-display);display:block;font-size:clamp(2rem,4.5vw,3rem);font-weight:800;letter-spacing:-.02em;background:linear-gradient(100deg,#FF3D51,#C8102E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
    .svc-stats .stat span{display:block;margin-top:.4rem;font-size:.86rem;color:rgba(255,255,255,.6);font-weight:600}

    /* How it helps — client vs candidate */
    .help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(16px,2.5vw,24px);margin-top:clamp(26px,4vw,38px)}
    .help-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(24px,3vw,34px)}
    .help-card h3{font-family:var(--font-display);font-size:1.18rem;font-weight:800;letter-spacing:-.01em;margin:0 0 1.1rem;display:flex;align-items:center;gap:.6rem}
    .help-card h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--red);flex:none}
    .help-card ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
    .help-card li{display:flex;gap:11px;align-items:flex-start;font-size:.96rem;line-height:1.55;color:var(--ink)}
    .help-card li svg{width:19px;height:19px;flex:none;color:var(--red);margin-top:1px}

    /* Process */
    .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(14px,1.5vw,20px);margin-top:clamp(28px,4vw,42px);align-items:start;counter-reset:step}
    @media(max-width:900px){.steps{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:560px){.steps{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:400px){.steps{grid-template-columns:1fr}}
    .step{position:relative;padding-top:8px}
    .step .n{font-family:var(--font-display);font-size:.8rem;font-weight:800;color:var(--red);letter-spacing:.1em}
    .step h4{font-family:var(--font-display);font-size:1.08rem;font-weight:800;margin:.5rem 0 .4rem;letter-spacing:-.01em}
    .step p{color:var(--muted);font-size:.93rem;line-height:1.6;margin:0}
    /* Highlighted process step (bright red) */
    .step.step-hot{background:linear-gradient(135deg,#C8102E,#E5213F);color:#fff;border-radius:16px;padding:20px 20px 18px;box-shadow:0 18px 40px -18px rgba(200,16,46,.6)}
    .step.step-hot .n{color:rgba(255,255,255,.8)}
    .step.step-hot h4{color:#fff}
    .step.step-hot p{color:rgba(255,255,255,.92)}

    /* CTA */
    .svc-cta{background:linear-gradient(158deg,#6C0E1A,#2A0C12);color:#fff;text-align:center;padding:clamp(56px,8vw,96px) 0}
    .svc-cta h2{font-family:var(--font-display);font-size:clamp(1.8rem,3.6vw,2.7rem);font-weight:800;letter-spacing:-.02em;margin:0}

    .btn-w{display:inline-flex;align-items:center;gap:.5rem;background:#fff;color:var(--red-deep);font-family:var(--font-display);font-weight:800;padding:14px 28px;border-radius:12px;font-size:.95rem;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .18s}
    .btn-w:hover{transform:translateY(-2px)}
    .btn-w svg{width:17px;height:17px}
    .btn-o{display:inline-flex;align-items:center;padding:14px 26px;border-radius:12px;border:1.5px solid rgba(255,255,255,.4);color:#fff;font-family:var(--font-display);font-weight:800;font-size:.95rem;transition:background .18s}
    .btn-o:hover{background:rgba(255,255,255,.1)}
    @media(max-width:560px){.svc-cta .btns{flex-direction:column}.btn-w,.btn-o{width:100%;justify-content:center}}

    /* Other services */
    .other{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(26px,4vw,38px)}
    .other a{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:.88rem;font-weight:700;color:var(--slate);transition:border-color .18s,color .18s,transform .18s}
    .other a:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px)}
    .state{padding:120px 0;text-align:center;color:var(--muted)}
  </style>

        var _lvls=[], _other=[];
        s.scope.forEach(function(x){ var m=String(x).match(/^Level\s*(\d+)\s*(?:\(([^)]+)\)|:\s*([^—\-]+?))\s*[—\-]\s*(.+)$/i); if(m) _lvls.push({n:m[1],name:(m[2]||m[3]||'').trim(),d:m[4]}); else _other.push(x); });
        var _lvlHtml=(_lvls.length>=2)?('<div class="svc-levels">'+_lvls.map(function(l){return '<div class="lvl"><span class="lvl-n">'+esc(('0'+l.n).slice(-2))+'</span><h3>'+esc(l.name)+'</h3><p>'+esc(l.d)+'</p></div>';}).join('')+'</div>'):'';
        var _listItems=_lvlHtml?_other:s.scope;
        var _listHtml=_listItems.length?('<ul class="scope'+(_lvlHtml?' scope-mt':'')+'">'+_listItems.map(liChk).join('')+'</ul>'):'';
        secScope='<section class="sec"><div class="wrap"><div class="sec-head"><div class="k">'+esc(L.scopeK)+'</div><h2>'+esc(L.scopeH)+'</h2></div>'+_lvlHtml+_listHtml+'</div></section>';
      }
      var secStats=(s.stats&&s.stats.length)?('<section class="svc-stats"><div class="wrap"><div class="statgrid">'+s.stats.map(function(t){return '<div class="stat"><b>'+esc(t.v)+'</b><span>'+esc(t.l)+'</span></div>';}).join('')+'</div></div></section>'):'';
      var hasHelp=(s.client&&s.client.length)||(s.applicant&&s.applicant.length);
      var secHelp=hasHelp?('<section class="sec sec-gray"><div class="wrap"><div class="sec-head"><div class="k">'+esc(L.helpK)+'</div><h2>'+esc(L.helpH)+'</h2></div><div class="help-grid">'
        +((s.client&&s.client.length)?('<div class="help-card"><h3>'+esc(L.helpBiz)+'</h3><ul>'+s.client.map(liChk).join('')+'</ul></div>'):'')
        +((s.applicant&&s.applicant.length)?('<div class="help-card"><h3>'+esc(L.helpPpl)+'</h3><ul>'+s.applicant.map(liChk).join('')+'</ul></div>'):'')
        +'</div></div></section>'):'';

      // Optional per-service video (YouTube). Rendered as a privacy-friendly
      // youtube-nocookie responsive embed, only when a valid link is set.
      var ytEmbed=function(u){ u=String(u||'').trim(); if(!u) return '';
        var id=/^[A-Za-z0-9_-]{11}$/.test(u)?u:((u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|v\/|live\/))([A-Za-z0-9_-]{11})/)||[])[1]||'');
        return id?('https://www.youtube-nocookie.com/embed/'+id+'?rel=0&modestbranding=1'):''; };
      var vsrc=ytEmbed(s.video);
      var secVideo=vsrc?('<section class="sec"><div class="wrap"><div class="sec-head"><div class="k">Watch</div><h2>A closer look</h2></div>'
        +'<div class="svc-video"><iframe src="'+vsrc+'" title="'+esc(s.title||'')+' video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>'
        +'</div></section>'):'';

      // Optional per-service experts / SMEs (photo + name) → profile cards.
      var expList=(s.experts||[]).filter(function(e){return e&&(e.name||e.photo);});
      var secExperts=expList.length?('<section class="sec"><div class="wrap"><div class="sec-head"><div class="k">Experts</div><h2>Meet the experts</h2></div><div class="svc-experts">'
        +expList.map(function(e){ return '<figure class="svc-expert"><div class="pic'+(e.photo?'':' noimg')+'">'+(e.photo?'<img src="'+esc(e.photo)+'" alt="'+esc(e.name||'')+'" loading="lazy">':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>')+'</div>'+((e.name||e.role)?'<figcaption>'+esc(e.name||'')+(e.role?'<span class="role">'+esc(e.role)+'</span>':'')+'</figcaption>':'')+'</figure>'; }).join('')
        +'</div></div></section>'):'';

      // Optional per-service partners / "trusted by" logo wall.
      // Partners marquee — multi-row scrolling logo wall (rows sliced from the
      // shared client collage). Shown when a partners image is set on the service.
      var PARTNER_ROWS=['/assets/img/partners-row-1.png','/assets/img/partners-row-2.png','/assets/img/partners-row-3.png','/assets/img/partners-row-4.png','/assets/img/partners-row-5.png'];
      var secPartners=s.partners?('<section class="sec sec-gray"><div class="wrap"><div class="sec-head"><div class="k">Trusted by</div><h2>Brands we’ve worked with</h2></div>'
        +'<div class="pmq" role="img" aria-label="Brands CNT has worked with">'+PARTNER_ROWS.map(function(src,i){ return '<div class="pmq-row'+((i%2)?' rev':'')+'" style="animation-duration:'+(30+i*5)+'s"><img src="'+src+'" alt="" aria-hidden="true"><img src="'+src+'" alt="" aria-hidden="true"></div>'; }).join('')+'</div>'
        +'</div></section>'):'';

      // Optional per-service testimonials (participant / client quotes).
      var tList=(s.testimonials||[]).filter(function(t){return t&&(t.quote||t.q);});
      var _chevL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
      var _chevR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
      var _stars=new Array(6).join('&#9733;');
      var _ini=function(str){ str=String(str||'').replace(/[^0-9A-Za-z\s]/g,' ').trim();
        var w=str.split(/\s+/).filter(Boolean).filter(function(x){return !/^(the|to|and|for|of|a|an|in|on|with|its|your)$/i.test(x);});
        var al=w.filter(function(x){return /^[A-Za-z]/.test(x);}); if(al.length) w=al;
        return (((w[0]||'').charAt(0)+(w[1]||'').charAt(0))||'CN').toUpperCase(); };
      var secTestimonials=tList.length?('<section class="sec"><div class="wrap"><div class="sec-head"><div class="k">'+esc(L.tstK)+'</div><h2>'+esc(L.tstH)+'</h2></div>'
        +'<div class="tq"><div class="tq-stage"><button class="tq-nav tq-prev" type="button" aria-label="Previous feedback">'+_chevL+'</button><button class="tq-nav tq-next" type="button" aria-label="Next feedback">'+_chevR+'</button><div class="tq-vp"><div class="tq-track">'
        +tList.map(function(t){ var q=t.quote||t.q||''; var a=t.author||t.a||'';
            return '<div class="tq-slide"><figure class="svc-quote">'
              +'<div class="tq-stars" role="img" aria-label="Rated 5 out of 5">'+_stars+'</div>'
              +'<blockquote>'+esc(q)+'</blockquote>'
              +'<figcaption class="tq-author"><span class="tq-avatar" aria-hidden="true">'+esc(_ini(a||'CNT'))+'</span>'
              +'<span class="tq-meta"><strong>'+esc(a||'Training participant')+'</strong><span>'+(a?'Training participant':'Feedback')+'</span></span></figcaption>'
              +'</figure></div>'; }).join('')
        +'</div></div></div><div class="tq-dots"></div></div>'
        +'</div></section>'):'';

      body.innerHTML=
        '<section class="sec"><div class="wrap">'
          +'<div class="sec-head"><div class="k">'+esc(L.ovK)+'</div><h2>'+esc(L.ovH)+'</h2><p>'+esc(s.overview)+'</p></div>'
        +'</div></section>'
        +secVideo
        +secWho
        +secScope
        +'<section class="sec'+(secScope?' sec-gray':'')+'"><div class="wrap">'
          +'<div class="sec-head"><div class="k">'+esc(L.hiK)+'</div><h2>'+esc(L.hiH)+'</h2></div>'
          +'<div class="hi-grid">'+hi+'</div>'
        +'</div></section>'
        +secStats
        +secHelp
        +'<section class="sec"><div class="wrap">'
          +'<div class="sec-head"><div class="k">'+esc(L.procK)+'</div><h2>'+esc(L.procH)+'</h2></div>'
          +'<div class="steps">'+steps+'</div>'
        +'</div></section>'
        +((s.images&&s.images.length)?('<section class="sec sec-gray"><div class="wrap"><div class="sec-head"><div class="k">Gallery</div><h2>See it in action</h2></div><div class="svc-gallery">'+s.images.map(function(u,i){return '<figure data-lb="'+i+'"><img src="'+esc(u)+'" alt="'+esc(s.title||'')+'" loading="lazy"></figure>';}).join('')+'</div></div></section>'):'')
        +secTestimonials
        +secExperts
        +'<section class="sec sec-gray"><div class="wrap">'
          +'<div class="sec-head"><div class="k">Explore more</div><h2>Other services</h2></div>'
          +'<div class="other">'+related(slug)+'</div>'
        +'</div></section>'
        +'<section class="svc-cta"><div class="wrap">'
          +'<h2>Let’s talk about '+esc(s.title)+'.</h2>'
          +'<p>Tell us what you need and our team will put together a plan built around your business.</p>'
          +'<div class="btns"><a class="btn-w" href="/#contact">Request a consultation '+arrow+'</a><a class="btn-o" href="/careers">Looking for a job?</a></div>'
        +'</div></section>';

      // Clickable gallery → lightbox viewer.
      if(s.images && s.images.length) wireLightbox(s.images, s.title||'');

      // Reveal the experts on scroll, staggered (CSS handles reduced-motion).
      try{
        var _ex=body.querySelector('.svc-experts');
        if(_ex){
          if('IntersectionObserver' in window){
            var _io=new IntersectionObserver(function(en){ en.forEach(function(x){ if(x.isIntersecting){ _ex.classList.add('in'); _io.disconnect(); } }); }, { threshold:.18 });
            _io.observe(_ex);
          } else { _ex.classList.add('in'); }
        }
      }catch(e){}

      // Feedback carousel.
      try{ wireQuotes(body); }catch(e){}

      // JSON-LD for this specific service.
      try{
        var ld=document.createElement('script'); ld.type='application/ld+json';
        ld.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Service","name":s.title,"description":s.tagline,"provider":{"@type":"Organization","name":"CNT Promo & Ads Specialists, Inc."},"areaServed":"PH"});
        document.head.appendChild(ld);
      }catch(e){}
    }

    // Feedback carousel: 2-up on desktop / 1-up on mobile, advancing one card
    // at a time, with dots + arrows + swipe + autoplay (respects reduced-motion).
    function wireQuotes(root){
      var tq=root.querySelector('.tq'); if(!tq) return;
      var track=tq.querySelector('.tq-track');
      var slides=track?track.children:[];
      var n=slides.length; if(!track || n===0) return;
      var dotsWrap=tq.querySelector('.tq-dots');
      var prevBtn=tq.querySelector('.tq-prev'), nextBtn=tq.querySelector('.tq-next');
      var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      var i=0, timer=null, perView=1, maxI=0, dots=[];
      function perViewNow(){ return window.innerWidth<=720 ? 1 : 2; }
      function buildDots(){
        if(!dotsWrap) return; dotsWrap.innerHTML=''; dots=[];
        for(var d=0; d<=maxI; d++){
          var b=document.createElement('button');
          b.className='tq-dot'; b.type='button';
          b.setAttribute('aria-label','Go to feedback '+(d+1));
          (function(idx){ b.addEventListener('click', function(){ go(idx); restart(); }); })(d);
          dotsWrap.appendChild(b); dots.push(b);
        }
      }
      function apply(){ var step=100/perView; track.style.transform='translateX('+(-i*step)+'%)'; for(var j=0;j<dots.length;j++) dots[j].classList.toggle('on', j===i); }
      function go(x){ i=Math.min(Math.max(x,0),maxI); apply(); }
      function next(){ i>=maxI?go(0):go(i+1); }
      function prev(){ i<=0?go(maxI):go(i-1); }
      function layout(){
        perView=perViewNow(); maxI=Math.max(0, n-perView); if(i>maxI) i=maxI;
        buildDots(); apply();
        var fits=n<=perView;
        if(prevBtn) prevBtn.style.display=fits?'none':'';
        if(nextBtn) nextBtn.style.display=fits?'none':'';
        if(dotsWrap) dotsWrap.style.display=fits?'none':'';
      }
      if(prevBtn) prevBtn.addEventListener('click', function(){ prev(); restart(); });
      if(nextBtn) nextBtn.addEventListener('click', function(){ next(); restart(); });
      function start(){ if(reduce || n<=perView) return; stop(); timer=setInterval(next, 5500); }
      function stop(){ if(timer){ clearInterval(timer); timer=null; } }
      function restart(){ stop(); start(); }
      tq.addEventListener('mouseenter', stop);
      tq.addEventListener('mouseleave', start);
      // Touch swipe.
      var x0=null, dx=0;
      track.addEventListener('touchstart', function(e){ x0=e.touches[0].clientX; dx=0; stop(); }, {passive:true});
      track.addEventListener('touchmove', function(e){ if(x0!==null) dx=e.touches[0].clientX-x0; }, {passive:true});
      track.addEventListener('touchend', function(){ if(Math.abs(dx)>40){ dx<0?next():prev(); } x0=null; start(); });
      var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(layout, 150); });
      layout(); start();
    }

    // Build a full-screen image viewer and bind it to the gallery figures.
    function wireLightbox(images, alt){
      var lb=document.getElementById('svc-lb');
      if(!lb){
        lb=document.createElement('div'); lb.id='svc-lb'; lb.className='lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true');
        lb.innerHTML='<button class="lb-close" aria-label="Close">&times;</button>'
          +'<div class="lb-stage">'
          +'<button class="lb-btn lb-prev" aria-label="Previous photo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'
          +'<img alt="">'
          +'<button class="lb-btn lb-next" aria-label="Next photo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>'
          +'<div class="lb-count"></div>'
          +'</div>';
        document.body.appendChild(lb);
      }
      var img=lb.querySelector('img'), count=lb.querySelector('.lb-count'), i=0;
      function show(n){ i=(n+images.length)%images.length; img.src=images[i]; img.alt=alt; count.textContent=(i+1)+' / '+images.length; }
      function open(n){ show(n); lb.classList.add('open'); document.documentElement.style.overflow='hidden'; }
      function close(){ lb.classList.remove('open'); document.documentElement.style.overflow=''; }
      lb.querySelector('.lb-close').onclick=close;
      lb.querySelector('.lb-prev').onclick=function(e){ e.stopPropagation(); show(i-1); };
      lb.querySelector('.lb-next').onclick=function(e){ e.stopPropagation(); show(i+1); };
      lb.onclick=function(e){ if(e.target===lb) close(); };
      document.addEventListener('keydown',function(e){
        if(!lb.classList.contains('open')) return;
        if(e.key==='Escape') close();
        else if(e.key==='ArrowLeft') show(i-1);
        else if(e.key==='ArrowRight') show(i+1);
      });
      Array.prototype.forEach.call(document.querySelectorAll('.svc-gallery figure'),function(fig){
        fig.setAttribute('tabindex','0'); fig.setAttribute('role','button');
        var idx=parseInt(fig.getAttribute('data-lb'),10)||0;
        fig.onclick=function(){ open(idx); };
        fig.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(idx); } };
      });
    }

    // Map a Content Studio (Supabase) row to the render shape.
    function fromDb(r){
      return { cat:r.category, icon:r.icon, title:r.title, red:r.red_word,
        tagline:r.tagline, overview:r.overview,
        highlights:Array.isArray(r.highlights)?r.highlights:[], image:r.image_url||'',
        video:r.video_url||'',
        experts:Array.isArray(r.experts)?r.experts:[],
        testimonials:Array.isArray(r.testimonials)?r.testimonials:[],
        partners:r.partners_image||'',
        process:Array.isArray(r.process_steps)?r.process_steps:[],
        images:Array.isArray(r.images)?r.images:[],
        who:Array.isArray(r.who_for)?r.who_for:[],
        scope:Array.isArray(r.scope)?r.scope:[],
        client:Array.isArray(r.client_benefits)?r.client_benefits:[],
        applicant:Array.isArray(r.applicant_benefits)?r.applicant_benefits:[],
        stats:Array.isArray(r.stats)?r.stats:[] };
    }
    // Fill empty portfolio fields with the built-in draft copy so pages read
    // complete before a manager customizes them in Content Studio.
    function withPortfolio(s, slug){
      var fb=PORT[slug]||{};
      if(!(s.who&&s.who.length)) s.who=fb.who||[];
      if(!(s.scope&&s.scope.length)) s.scope=fb.scope||[];
      if(!(s.client&&s.client.length)) s.client=fb.client||[];
      if(!(s.applicant&&s.applicant.length)) s.applicant=fb.applicant||[];
      if(!(s.stats&&s.stats.length)) s.stats=companyStats();
      return s;
    }
    // Prefer live content from Content Studio; fall back to the built-in copy.
    async function load(slug){
      if(!slug){ location.replace('/services'); return; }
      var sb=window.getSupabase && window.getSupabase();
      if(sb){
        try{
          var r=await sb.from('services').select('*').eq('slug',slug).eq('published',true).maybeSingle();
          if(!r.error && r.data){ var _s=fromDb(r.data); if(CONTENT_OVERRIDE[slug]) _s=Object.assign(_s, CONTENT_OVERRIDE[slug]); render(withPortfolio(_s, slug), slug); return; }
        }catch(e){}
      }
      if(SERVICES[slug]) render(withPortfolio(SERVICES[slug], slug), slug);
      else location.replace('/services');
    }
    load(((new URLSearchParams(location.search)).get('s')||'').toLowerCase().trim());
  })();
  </script>
